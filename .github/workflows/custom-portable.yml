name: Custom portable Windows x64
on:
  workflow_dispatch:
  push:
    branches: [portable-custom]
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run lint
      - run: npm run site:check
      - name: Rust unit and HTTP contract tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Compile standalone x64 executable
        run: npm run tauri -- build --no-bundle --target x86_64-pc-windows-msvc
      - name: Verify PE architecture, launch, and package
        shell: pwsh
        run: ./scripts/package-portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: cs16browser-custom-portable-win64
          path: cs16browser-custom-portable-win64.zip
          if-no-files-found: error
          retention-days: 90
