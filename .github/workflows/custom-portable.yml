# Custom portable build of https://github.com/vuxsoftware/cs16browser
# GPL-3.0-or-later. The customization script is embedded below in plain text.
# This workflow does NOT install software on your computer or modify your Steam/CS 1.6 files.
name: Build CS 1.6 Portable (custom filters)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/custom-portable.yml]

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Apply filters and portable changes from open-source patch
        shell: bash
        run: |
          mkdir -p extras
          cat > extras/customize.py <<'CUSTOM_PATCH_PY'
          #!/usr/bin/env python3
          """Apply the CS 1.6 Browser Portable customizations to vuxsoftware/cs16browser.
          
          For the 0.1.0 tree from 2026-10-24. Refuses unexpected upstream changes.
          This script does not download, install, execute, or upload any binaries.
          """
          from __future__ import annotations
          from pathlib import Path
          import sys
          
          ROOT = Path(sys.argv[1] if len(sys.argv) > 1 else '.').resolve()
          
          
          def edit(relative: str, changes: list[tuple[str, str]]) -> None:
              path = ROOT / relative
              if not path.is_file():
                  raise SystemExit(f"Missing upstream source: {path}")
              text = path.read_text(encoding='utf-8')
              for old, new in changes:
                  n = text.count(old)
                  if n != 1:
                      raise SystemExit(f"Upstream source changed: {relative}; anchor occurred {n} times:\n{old[:180]}")
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
              print('Modified:', relative)
          
          
          edit('src/lib/columns.ts', [
              ('''  {
              id: "secure",
              label: "Anti-cheat",
              items: OPT_SECURE,
              width: "small",
              wide: true,
              text: false,
              locked: false,
            },
          ] as const;''', '''  {
              id: "secure",
              label: "Anti-cheat",
              items: OPT_SECURE,
              width: "small",
              wide: true,
              text: false,
              locked: false,
            },
            {
              id: "game",
              label: "Game",
              items: [] as string[],
              width: "game",
              wide: false,
              text: true,
              locked: false,
            },
          ] as const;'''),
          ])
          
          edit('src/lib/FilterPanel.svelte', [
              ('placeholder={field.id === "name" ? "Contains..." : undefined}',
               'placeholder={field.id === "name" || field.id === "game" ? "Contains... / !ads" : undefined}'),
              ('maxlength={field.id === "name" ? 128 : 64}',
               'maxlength={field.id === "name" ? 128 : field.id === "game" ? 128 : 64}'),
              ('          spellcheck="false"\n',
               '          spellcheck="false"\n          title="Comma-separated words: text includes; !text excludes (e.g. !www,!discord)"\n'),
          ])
          
          edit('src/lib/store.svelte.ts', [
              ('import { CHECKS, OPT_LATENCY, OPT_SECURE, ROW_H } from "./columns";',
               'import { CHECKS, OPT_LATENCY, OPT_SECURE, ROW_H } from "./columns";\nimport { continentFor } from "./regions";'),
              ('  discovery: Discovery;\n  checks: Checks;',
               '''  discovery: Discovery;
            checks: Checks;
            geoCountry: string | null;
            geoContinent: string | null;'''),
              ('const FILTERS_KEY = "cs16browser.filters";',
               'const FILTERS_KEY = "cs16browser.filters";\nconst GEO_KEY = "cs16browser.portable.geo";'),
              ('const discovery: Discovery = { name: "", map: "", latency: "< 100", secure: "Secure" };',
               'const discovery: Discovery = { name: "", map: "", game: "", latency: "< 100", secure: "Secure" };'),
              ('    if (typeof d.name === "string") discovery.name = d.name.slice(0, 128);',
               '    if (typeof d.name === "string") discovery.name = d.name.slice(0, 128);\n    if (typeof d.game === "string") discovery.game = d.game.slice(0, 128);'),
              ('const filters = reviveFilters();', '''const filters = reviveFilters();
          
          function reviveGeo(): { country: string | null; continent: string | null } {
            try {
              const raw = JSON.parse(localStorage.getItem(GEO_KEY) ?? "null") as unknown;
              if (!raw || typeof raw !== "object") return { country: null, continent: null };
              const value = raw as { country?: unknown; continent?: unknown };
              return {
                country: typeof value.country === "string" && /^[A-Z]{2}$/.test(value.country)
                  ? value.country : null,
                continent: typeof value.continent === "string" &&
                  ["North America", "South America", "Europe", "Asia", "Africa", "Oceania"].includes(value.continent)
                  ? value.continent : null,
              };
            } catch {
              return { country: null, continent: null };
            }
          }
          const geo = reviveGeo();'''),
              ('  discovery: filters.discovery,\n  checks: filters.checks,',
               '  discovery: filters.discovery,\n  checks: filters.checks,\n  geoCountry: geo.country,\n  geoContinent: geo.continent,'),
              ('        map: ui.discovery.map,\n        latency: ui.discovery.latency,',
               '        map: ui.discovery.map,\n        game: ui.discovery.game,\n        latency: ui.discovery.latency,'),
              ('/** The Anti-cheat dropdown, applied to what the server itself reported:', '''$effect.root(() => {
            $effect(() => {
              const country = ui.geoCountry;
              const continent = ui.geoContinent;
              try { localStorage.setItem(GEO_KEY, JSON.stringify({ country, continent })); }
              catch { /* Best effort. */ }
            });
          });
          
          export function filterCountry(country: string): void {
            ui.geoCountry = country.toUpperCase();
            ui.geoContinent = null;
            recompute();
          }
          
          export function filterContinent(continent: string): void {
            ui.geoCountry = null;
            ui.geoContinent = continent;
            recompute();
          }
          
          export function clearGeoFilter(): void {
            ui.geoCountry = null;
            ui.geoContinent = null;
            recompute();
          }
          
          /** The Anti-cheat dropdown, applied to what the server itself reported:'''),
              ('''/** The Name entry matches any case-insensitive part of the server hostname. */
          function nameMatches(row: ServerRow): boolean {
            const want = ui.discovery.name.trim().toLowerCase();
            return !want || row.hostname.toLowerCase().includes(want);
          }
          ''', '''/** Both Name and Game use inclusive and negative keyword filters.
           * e.g. `classic,!discord,!www` includes classic and excludes ads.
           * Commas form OR among inclusive terms and AND among exclusions. */
          export function keywordMatches(value: string, input: string): boolean {
            const terms = input.split(",").map((part) => part.trim().toLowerCase()).filter(Boolean);
            const positives = terms.filter((part) => !part.startsWith("!"));
            const negatives = terms.filter((part) => part.startsWith("!")).map((part) => part.slice(1)).filter(Boolean);
            const haystack = value.toLowerCase();
            return (positives.length === 0 || positives.some((term) => haystack.includes(term))) &&
              negatives.every((term) => !haystack.includes(term));
          }
          
          function nameMatches(row: ServerRow): boolean {
            return keywordMatches(row.hostname, ui.discovery.name);
          }
          
          function gameMatches(row: ServerRow): boolean {
            return keywordMatches(row.game, ui.discovery.game);
          }
          
          function locationMatches(row: ServerRow): boolean {
            if (ui.geoCountry && row.country !== ui.geoCountry) return false;
            if (ui.geoContinent && continentFor(row.country) !== ui.geoContinent) return false;
            return true;
          }
          '''),
              ('if (!passesChecks(row) || !passesSecure(row) || !mapMatches(row) || !nameMatches(row))',
               'if (!passesChecks(row) || !passesSecure(row) || !mapMatches(row) || !nameMatches(row) || !gameMatches(row) || !locationMatches(row))'),
              ('''  const map = ui.discovery.map.trim();
            if (map) parts.push(`map ${map}`);''',
               '''  const map = ui.discovery.map.trim();
            if (map) parts.push(`map ${map}`);
            const game = ui.discovery.game.trim();
            if (game) parts.push(`game filter ${game}`);
            if (ui.geoCountry) parts.push(`country ${ui.geoCountry}`);
            else if (ui.geoContinent) parts.push(`continent ${ui.geoContinent}`);'''),
          ])
          
          edit('src/lib/App.svelte', [
              ('  import { autoUpdateEnabled } from "$lib/updatePreference";',
               '  import { autoUpdateEnabled } from "$lib/updatePreference";\n  import { continentFor } from "$lib/regions";'),
              ('''      bannedTab
                  ? { label: "Add to whitelist", disabled: !row }
                  : { label: "Add to banned", disabled: !row },''',
               '''      bannedTab
                  ? { label: "Add to whitelist", disabled: !row }
                  : { label: "Add to banned", disabled: !row },
                { label: `Show only country: ${row?.country ?? "unknown"}`, disabled: !row?.country },
                { label: `Show only continent: ${continentFor(row?.country ?? null) ?? "unknown"}`,
                  disabled: !continentFor(row?.country ?? null) },
                { label: "Clear location filter", disabled: !ui.geoCountry && !ui.geoContinent },'''),
              ('''    if (action === "Connect to server") connectRow(endpoint);''',
               '''    if (action?.startsWith("Show only country: ")) {
                const row = ui.rows[ui.index.get(endpoint) ?? -1];
                if (row?.country) store.filterCountry(row.country);
              } else if (action?.startsWith("Show only continent: ")) {
                const row = ui.rows[ui.index.get(endpoint) ?? -1];
                const continent = continentFor(row?.country ?? null);
                if (continent) store.filterContinent(continent);
              } else if (action === "Clear location filter") store.clearGeoFilter();
              else if (action === "Connect to server") connectRow(endpoint);'''),
              ('      const n = 4;\n      if (event.key === "ArrowDown")',
               '      const n = ctxItems().length;\n      if (event.key === "ArrowDown")'),
          ])
          
          # Use IP geolocation for country flags / region filtering, not an AMX server
          # language setting. Language is only a fallback for unknown IP addresses.
          edit('src-tauri/src/country.rs', [
              ('    rules.and_then(from_rules).or_else(|| from_ip(ip))',
               '    from_ip(ip).or_else(|| rules.and_then(from_rules))'),
              ('fn language_wins_only_when_recognized()', 'fn ip_geolocation_preferred_over_server_language()'),
              ('''            resolve(ip, Some(&[("amx_language".into(), "pl".into())])),
                      Some("PL")''',
               '''            resolve(ip, Some(&[("amx_language".into(), "pl".into())])),
                      Some("US")'''),
          ])
          
          edit('src/app.css', [
              ('''@media (max-width: 1150px) {
            .filtergrid { grid-template-columns: 447px; row-gap: 6px; }
            .checks { position: absolute; left: 44px; right: auto; top: 150px; }
            .app { --panel-h: 420px; }
          }''',
               '''@media (max-width: 1150px) {
            .filtergrid { grid-template-columns: 447px; row-gap: 6px; }
            .checks { position: absolute; left: 475px; right: auto; top: 15px; }
            .app { --panel-h: 420px; }
          }'''),
          ])
          
          # Custom builds must NOT upgrade themselves into upstream's signed installer.
          # User can still install future upstream releases separately if desired.
          update = ROOT / 'src/lib/updatePreference.ts'
          if not update.is_file():
              raise SystemExit('Missing updatePreference.ts')
          update.write_text('''/* Portable custom build: do not install upstream auto-updates over our changes. */
          export function autoUpdateEnabled(): boolean { return false; }
          export function setAutoUpdateEnabled(_enabled: boolean): void {
            /* Deliberately disabled for standalone build. */
          }
          ''', encoding='utf-8')
          print('Modified: src/lib/updatePreference.ts')
          
          regions = ROOT / 'src/lib/regions.ts'
          regions.write_text('''/** Country/continent grouping for the Geo right-click filter.
           * Used with IPv4 location data provided by Rust, not guessed from hostnames. */
          const countries: Readonly<Record<string, string>> = {
            "North America": "US CA MX GL BM PM AG AI AW BB BL BS BZ CR CU CW DM DO GD GP GT HN HT JM KN KY LC MF MQ MS NI PA PR SV SX TC TT VC VG VI", 
            "South America": "AR BO BR CL CO EC FK GF GY PE PY SR UY VE",
            "Europe": "AD AL AT AX BA BE BG BY CH CZ DE DK EE ES FI FO FR GB GG GI GR HR HU IE IM IS IT JE LI LT LU LV MC MD ME MK MT NL NO PL PT RO RS RU SE SI SJ SK SM UA VA XK",
            "Asia": "AE AF AM AZ BD BH BN BT CN CY GE HK ID IL IN IQ IR JO JP KG KH KP KR KZ LA LB LK MM MN MO MV MY NP OM PH PK PS QA SA SG SY TH TJ TL TM TR TW UZ VN YE",
            "Africa": "AO BF BI BJ BW CD CF CG CI CM CV DJ DZ EG EH ER ET GA GH GM GN GQ GW KE KM LR LS LY MA MG ML MR MU MW MZ NA NE NG RE RW SC SD SH SL SN SO SS ST SZ TD TG TN TZ UG YT ZA ZM ZW",
            "Oceania": "AS AU CK FJ FM GU KI MH MP NC NF NR NU NZ PF PG PN PW SB TK TO TV VU WF WS"
          };
          const mapped = new Map<string, string>();
          for (const [continent, codes] of Object.entries(countries))
            for (const code of codes.split(" ")) if (code) mapped.set(code, continent);
          export function continentFor(country: string | null): string | null {
            return country ? (mapped.get(country.toUpperCase()) ?? null) : null;
          }
          ''', encoding='utf-8')
          print('Created: src/lib/regions.ts')
          
          # Regression tests exercise the real store filter and country code helper.
          tests = ROOT / 'src/lib/portable.test.ts'
          tests.write_text('''import { beforeEach, expect, it } from "vitest";
          import { keywordMatches } from "./store.svelte";
          import { continentFor } from "./regions";
          import * as store from "./store.svelte";
          import type { ServerRow } from "./bindings";
          
          const row = (endpoint: string, changes: Partial<ServerRow> = {}): ServerRow => ({
            endpoint, hostname: "[VIP] Classic | Discord.gg", map: "de_dust2",
            gamedir: "cstrike", game: "www.adserver.net", players: 4, max_players: 16,
            bots: 0, bot_plugin: null, ping_ms: 30, secure: true, password: false,
            os: 1, live: true, outcome: "ok", banned: false, fake: false,
            verified: true, reasons: [], soft_reasons: [], country: "US", version: "", players_list: [],
            ...changes,
          });
          
          beforeEach(() => {
            store.reset();
            store.ui.tab = 0;
            store.ui.discovery.name = "";
            store.ui.discovery.game = "";
            store.ui.discovery.map = "";
            store.ui.discovery.secure = "<All>";
            store.ui.discovery.latency = "<All>";
            store.clearGeoFilter();
            for (const key of Object.keys(store.ui.checks) as (keyof typeof store.ui.checks)[])
              store.ui.checks[key] = false;
          });
          
          it("matches game descriptions with comma-separated exclude keywords", () => {
            expect(keywordMatches("www.adserver.net", "!www,!discord")).toBe(false);
            expect(keywordMatches("Counter-Strike", "!www,!discord")).toBe(true);
            expect(keywordMatches("Server | VIP", "classic,vip,!discord")).toBe(true);
            expect(keywordMatches("VIP Discord", "classic,vip,!discord")).toBe(false);
          });
          
          it("filters Game column independently from server Name", () => {
            store.upsert(row("ads"));
            store.upsert(row("clean", { game: "Counter-Strike" }));
            store.recompute();
            expect(store.ui.order).toHaveLength(2);
            store.ui.discovery.game = "!www";
            store.recompute();
            expect(store.ui.order.map((i) => store.ui.rows[i].endpoint)).toEqual(["clean"]);
            store.ui.discovery.name = "!Discord";
            store.recompute();
            expect(store.ui.order).toHaveLength(0);
          });
          
          it("limits countries and continents while preserving banned view", () => {
            store.upsert(row("us", { country: "US" }));
            store.upsert(row("fr", { country: "FR" }));
            store.upsert(row("au", { country: "AU" }));
            store.filterContinent("Europe");
            expect(store.ui.order.map((i) => store.ui.rows[i].endpoint)).toEqual(["fr"]);
            store.filterCountry("US");
            expect(store.ui.order.map((i) => store.ui.rows[i].endpoint)).toEqual(["us"]);
            store.clearGeoFilter();
            expect(store.ui.order).toHaveLength(3);
            expect(continentFor("AU")).toBe("Oceania");
          });
          ''', encoding='utf-8')
          print('Created: src/lib/portable.test.ts')
          print('SUCCESS: filter and region customization applied.')
          CUSTOM_PATCH_PY
          python extras/customize.py .
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Check frontend TypeScript and Svelte
        run: bun run check
      - name: Run frontend tests
        run: bun run test
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Compile portable Windows executable
        run: bun run tauri build --no-bundle
      - name: Package standalone application and corresponding source patch
        shell: pwsh
        run: |
          New-Item -ItemType Directory portable | Out-Null
          Copy-Item src-tauri/target/release/cs16browser.exe portable/cs16browser-portable.exe
          Copy-Item LICENSE portable/LICENSE-GPL-3.0.txt
          Copy-Item extras/customize.py portable/customize-source.py
          "Upstream https://github.com/vuxsoftware/cs16browser ; corresponding source: https://github.com/${{ github.repository }} at commit ${{ github.sha }} plus customize-source.py applied to checkout." | Set-Content portable/SOURCE.txt
          "Extract and run cs16browser-portable.exe (no install). Needs Windows 64-bit, Microsoft WebView2 Runtime, Steam/CS 1.6 and a Steam Web API key. Unsigned: scan executable with Microsoft Defender. Preferences may still save to your Windows profile." | Set-Content portable/README.txt
          Get-FileHash portable/cs16browser-portable.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  cs16browser-portable.exe" } | Set-Content portable/SHA256.txt
          Compress-Archive -Path portable/* -DestinationPath cs16browser-custom-portable-win64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: cs16browser-custom-portable-win64
          path: cs16browser-custom-portable-win64.zip
          if-no-files-found: error
